name: Release

on:
  push:
    tags:
      - "v*"

# The release job is the only thing in this repository that needs write access,
# and it needs it only to create the release and upload the archives.
permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives version metadata from tags and their history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The gate before publishing anything. A tag that cannot pass the same
      # checks every push passes has no business becoming a release.
      - name: test
        run: go test -race -count=1 ./...
      - name: Prepare release notes
        shell: bash
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $1 == "##" {
              if (found) exit
              found = $2 == "[" version "]"
              next
            }
            found { print; if (NF) content = 1 }
            END { if (!content) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes "${{ runner.temp }}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
